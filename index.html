<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intimlogg & Inspirasjon</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #ec4899;
      --primary-hover: #db2777;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
      min-height: 100vh;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    nav button.active {
      color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Uke-kort */
    .week-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-card:hover {
      border-color: var(--primary);
    }

    .day-info h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .day-info p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #334155;
      color: var(--text-sub);
    }

    .status-badge.active {
      background: rgba(236, 72, 153, 0.2);
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    /* Inspirasjonsbank */
    .bank-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .position-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .position-card h4 {
      color: var(--primary);
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .position-card p {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    /* Modal / Skjema */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--card-border);
    }

    .modal h3 {
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .toggle-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">Ukeoversikt</h1>
  </header>

  <main>
    <!-- Fane 1: Ukeoversikt -->
    <section id="tab-week" class="tab-content active">
      <div class="week-grid" id="week-container"></div>
    </section>

    <!-- Fane 2: Inspirasjonsbank -->
    <section id="tab-bank" class="tab-content">
      <button class="btn" onclick="openAddPositionModal()" style="margin-bottom: 16px;">+ Legg til ny posisjon</button>
      <div class="bank-list" id="bank-container"></div>
    </section>
  </main>

  <nav>
    <button class="active" onclick="switchTab('week')">📅 Uke</button>
    <button onclick="switchTab('bank')">💡 Inspirasjonsbank</button>
  </nav>

  <!-- Modal for dagsregistrering -->
  <div class="modal" id="day-modal">
    <div class="modal-content">
      <h3 id="modal-day-name">Registrer Dag</h3>
      
      <div class="toggle-group">
        <input type="checkbox" id="had-sex">
        <label for="had-sex" style="font-weight: 600;">Hatt samleie denne dagen</label>
      </div>

      <div class="form-group">
        <label for="pos-select">Velg posisjon(er) fra banken</label>
        <select id="pos-select" multiple size="3"></select>
      </div>

      <div class="form-group">
        <label for="day-notes">Notater / Egne ønsker</label>
        <textarea id="day-notes" rows="3" placeholder="F.eks. stemning, spesielle ønsker..."></textarea>
      </div>

      <button class="btn" onclick="saveDayLog()">Lagre</button>
      <button class="btn" style="background: transparent; color: var(--text-sub);" onclick="closeModal('day-modal')">Avbryt</button>
    </div>
  </div>

  <!-- Modal for ny posisjon -->
  <div class="modal" id="pos-modal">
    <div class="modal-content">
      <h3>Legg til posisjon</h3>
      <div class="form-group">
        <label for="new-pos-title">Navn på posisjon</label>
        <input type="text" id="new-pos-title" placeholder="F.eks. Skjeen">
      </div>
      <div class="form-group">
        <label for="new-pos-desc">Forklaring / Beskrivelse</label>
        <textarea id="new-pos-desc" rows="3" placeholder="Kort beskrivelse av hvordan den utføres..."></textarea>
      </div>
      <button class="btn" onclick="saveNewPosition()">Lagre i banken</button>
      <button class="btn" style="background: transparent; color: var(--text-sub);" onclick="closeModal('pos-modal')">Avbryt</button>
    </div>
  </div>

  <script>
    const daysOfWeek = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
    
    // Standard posisjonsbank
    let positionBank = JSON.parse(localStorage.getItem('positionBank')) || [
      { id: 1, title: 'Misjonær', desc: 'Klassisk posisjon ansikt til ansikt som gir god intimitet og mulighet for øyekontakt og kyssing.' },
      { id: 2, title: 'Skjeen', desc: 'Begge ligger på siden i samme retning. Svært avslappende, intim og behagelig posisjon.' },
      { id: 3, title: 'Kvinne/Partner på topp', desc: 'Gir den som sitter øverst full kontroll over tempo, vinkel og dybde.' },
      { id: 4, title: 'Bakfra (Doggy)', desc: 'Posisjon bakfra som gir mulighet for dyp penetrasjon og stimulering.' }
    ];

    // Logg for uken
    let weekLog = JSON.parse(localStorage.getItem('weekLog')) || {};
    let activeDay = null;

    function init() {
      renderWeek();
      renderBank();
    }

    function renderWeek() {
      const container = document.getElementById('week-container');
      container.innerHTML = '';

      daysOfWeek.forEach(day => {
        const log = weekLog[day] || { hadSex: false, positions: [], notes: '' };
        const card = document.createElement('div');
        card.className = 'day-card';
        card.onclick = () => openDayModal(day);

        const posText = log.positions.length > 0 ? `Posisjoner: ${log.positions.join(', ')}` : (log.notes || 'Ingen notater');

        card.innerHTML = `
          <div class="day-info">
            <h3>${day}</h3>
            <p>${log.hadSex ? posText : 'Ingen registrering'}</p>
          </div>
          <div class="status-badge ${log.hadSex ? 'active' : ''}">
            ${log.hadSex ? '❤️ Ja' : 'Nei'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderBank() {
      const container = document.getElementById('bank-container');
      const select = document.getElementById('pos-select');
      container.innerHTML = '';
      select.innerHTML = '';

      positionBank.forEach(pos => {
        // Render i listen
        const card = document.createElement('div');
        card.className = 'position-card';
        card.innerHTML = `
          <h4>${pos.title}</h4>
          <p>${pos.desc}</p>
        `;
        container.appendChild(card);

        // Render i select-boksen
        const opt = document.createElement('option');
        opt.value = pos.title;
        opt.innerText = pos.title;
        select.appendChild(opt);
      });
    }

    function openDayModal(day) {
      activeDay = day;
      document.getElementById('modal-day-name').innerText = `Registrer for ${day}`;
      const log = weekLog[day] || { hadSex: false, positions: [], notes: '' };
      
      document.getElementById('had-sex').checked = log.hadSex;
      document.getElementById('day-notes').value = log.notes || '';
      
      const select = document.getElementById('pos-select');
      Array.from(select.options).forEach(opt => {
        opt.selected = log.positions.includes(opt.value);
      });

      document.getElementById('day-modal').style.display = 'flex';
    }

    function saveDayLog() {
      const hadSex = document.getElementById('had-sex').checked;
      const notes = document.getElementById('day-notes').value;
      const select = document.getElementById('pos-select');
      const selectedPositions = Array.from(select.selectedOptions).map(opt => opt.value);

      weekLog[activeDay] = { hadSex, positions: selectedPositions, notes };
      localStorage.setItem('weekLog', JSON.stringify(weekLog));
      
      closeModal('day-modal');
      renderWeek();
    }

    function openAddPositionModal() {
      document.getElementById('pos-modal').style.display = 'flex';
    }

    function saveNewPosition() {
      const title = document.getElementById('new-pos-title').value;
      const desc = document.getElementById('new-pos-desc').value;

      if (!title) return alert('Vennligst oppgi et navn');

      positionBank.push({ id: Date.now(), title, desc });
      localStorage.setItem('positionBank', JSON.stringify(positionBank));

      document.getElementById('new-pos-title').value = '';
      document.getElementById('new-pos-desc').value = '';

      closeModal('pos-modal');
      renderBank();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (tab === 'week') {
        document.getElementById('tab-week').classList.add('active');
        document.getElementById('header-title').innerText = 'Ukeoversikt';
        event.target.classList.add('active');
      } else {
        document.getElementById('tab-bank').classList.add('active');
        document.getElementById('header-title').innerText = 'Inspirasjonsbank';
        event.target.classList.add('active');
      }
    }

    init();
  </script>
</body>
</html>
